<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 215" width="200" height="215">
  <defs>
    <style>
      .w { fill: #ffffff; }
      .t { fill: rgba(45,89,168,0.35); }
    </style>
  </defs>
  <g transform="translate(100,100)">
    <!-- 24 gear teeth: WHITE -->
    <g class="w">
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(0)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(15)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(30)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(45)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(60)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(75)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(90)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(105)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(120)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(135)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(150)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(165)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(180)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(195)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(210)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(225)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(240)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(255)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(270)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(285)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(300)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(315)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(330)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(345)"/>
    </g>
    <!-- Gear ring body: WHITE -->
    <circle r="84" class="w"/>
    <!-- Inner circle: semi-transparent blue (so it shows as darker on nav) -->
    <circle r="68" class="t"/>
    <!-- Scales pole -->
    <rect x="-2" y="-52" width="4" height="62" rx="2" class="w"/>
    <rect x="-30" y="-52" width="60" height="4" rx="2" class="w"/>
    <circle cx="0" cy="-56" r="5" class="w"/>
    <!-- Left chain & pan -->
    <line x1="-28" y1="-50" x2="-28" y2="-20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-42" y1="-20" x2="-14" y2="-20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -42,-20 Q -28,-14 -14,-20" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Right chain & pan -->
    <line x1="28" y1="-50" x2="28" y2="-20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="-20" x2="42" y2="-20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14,-20 Q 28,-14 42,-20" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Boy -->
    <circle cx="-18" cy="-2" r="6" class="w"/>
    <line x1="-18" y1="4" x2="-18" y2="22" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-26" y1="10" x2="-10" y2="10" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-18" y1="22" x2="-24" y2="34" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-18" y1="22" x2="-12" y2="34" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Girl -->
    <circle cx="18" cy="-2" r="6" class="w"/>
    <line x1="18" y1="4" x2="18" y2="22" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="10" y1="10" x2="26" y2="10" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="10" y1="34" x2="18" y2="22" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="26" y1="34" x2="18" y2="22" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Text: WHITE on dark -->
    <text x="0" y="55" font-family="Jost,Futura,Century Gothic,sans-serif" font-weight="900" font-size="10.5" letter-spacing="1.8" fill="white" text-anchor="middle">CHILD JUSTICE FORUM</text>
  </g>
</svg>