      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(345)"/>
    </g>
    <!-- Gear ring body: Saphire -->
    <circle r="84" fill="#2d59a8"/>
    <!-- White inner circle: WHITE (brand spec) -->
    <circle r="68" fill="#ffffff"/>
    <!-- Scales pole: Saphire -->
    <rect x="-2" y="-52" width="4" height="62" rx="2" fill="#2d59a8"/>
    <rect x="-30" y="-52" width="60" height="4" rx="2" fill="#2d59a8"/>
    <circle cx="0" cy="-56" r="5" fill="#2d59a8"/>
    <!-- Left scale -->
    <line x1="-28" y1="-50" x2="-28" y2="-20" stroke="#2d59a8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-42" y1="-20" x2="-14" y2="-20" stroke="#2d59a8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -42,-20 Q -28,-14 -14,-20" stroke="#2d59a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Right scale -->
    <line x1="28" y1="-50" x2="28" y2="-20" stroke="#2d59a8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="-20" x2="42" y2="-20" stroke="#2d59a8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14,-20 Q 28,-14 42,-20" stroke="#2d59a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Boy silhouette: Saphire -->
    <circle cx="-18" cy="-2" r="6" fill="#2d59a8"/>
    <line x1="-18" y1="4" x2="-18" y2="22" stroke="#2d59a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-26" y1="10" x2="-10" y2="10" stroke="#2d59a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-18" y1="22" x2="-24" y2="34" stroke="#2d59a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-18" y1="22" x2="-12" y2="34" stroke="#2d59a8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Girl silhouette: Saphire -->
    <circle cx="18" cy="-2" r="6" fill="#2d59a8"/>
    <line x1="18" y1="4" x2="18" y2="22" stroke="#2d59a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="10" y1="10" x2="26" y2="10" stroke="#2d59a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="10" y1="34" x2="18" y2="22" stroke="#2d59a8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="26" y1="34" x2="18" y2="22" stroke="#2d59a8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Text: Saphire, Futura Bold style -->
    <text x="0" y="55" font-family="Jost,Futura,Century Gothic,sans-serif" font-weight="900" font-size="10.5" letter-spacing="1.8" fill="#2d59a8" text-anchor="middle">CHILD JUSTICE FORUM</text>
  </g>
