      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(15)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(30)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(45)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(60)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(75)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(90)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(105)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(120)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(135)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(150)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(165)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(180)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(195)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(210)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(225)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(240)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(255)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(270)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(285)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(300)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(315)"/>
