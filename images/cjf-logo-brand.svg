<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <style>
      .brand-blue { fill: #2d59a8; }
      .white-fill { fill: #ffffff; }
      .logo-text { 
        font-family: "Jost", "Futura", "Century Gothic", sans-serif;
        font-weight: 900;
        font-size: 11px;
        letter-spacing: 1.8px;
        fill: #2d59a8;
        text-anchor: middle;
      }
    </style>
  </defs>
  
  <!-- GEAR RING: 24 teeth, Saphire blue -->
  <g transform="translate(100,100)">
    <!-- Gear teeth: 24 rectangular teeth around circumference -->
    <g class="brand-blue">
      <!-- Generate 24 gear teeth using rotation -->
      <!-- Each tooth is a rectangle rotated around the centre -->
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(0)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(15)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(30)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(45)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(60)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(75)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(90)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(105)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(120)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(135)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(150)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(165)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(180)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(195)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(210)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(225)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(240)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(255)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(270)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(285)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(300)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(315)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(330)"/>
      <rect x="-5.5" y="-97" width="11" height="16" rx="2" transform="rotate(345)"/>
    </g>
    
    <!-- Gear body ring: Saphire donut -->
    <circle r="84" class="brand-blue"/>
    
    <!-- White inner circle (brand: circle face/background = WHITE) -->
    <circle r="68" class="white-fill"/>
    
    <!-- SCALES OF JUSTICE -->
    <!-- Central vertical pole -->
    <rect x="-2" y="-52" width="4" height="62" rx="2" class="brand-blue"/>
    <!-- Horizontal beam -->
    <rect x="-30" y="-52" width="60" height="4" rx="2" class="brand-blue"/>
    <!-- Top finial -->
    <circle cx="0" cy="-56" r="5" class="brand-blue"/>
    
    <!-- Left scale chain -->
    <line x1="-28" y1="-50" x2="-28" y2="-20" stroke="#2d59a8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left scale pan -->
    <path d="M -42,-20 Q -28,-14 -14,-20" stroke="#2d59a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="-42" y1="-20" x2="-14" y2="-20" stroke="#2d59a8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Right scale chain -->
    <line x1="28" y1="-50" x2="28" y2="-20" stroke="#2d59a8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right scale pan -->
    <path d="M 14,-20 Q 28,-14 42,-20" stroke="#2d59a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="14" y1="-20" x2="42" y2="-20" stroke="#2d59a8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- CHILDREN SILHOUETTES: boy (left) and girl (right) -->
    <!-- Boy - left -->
    <circle cx="-18" cy="-2" r="6" class="brand-blue"/>
    <path d="M -18,4 L -18,22 M -26,10 L -10,10 M -18,22 L -24,34 M -18,22 L -12,34" 
          stroke="#2d59a8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    
    <!-- Girl - right -->
    <circle cx="18" cy="-2" r="6" class="brand-blue"/>
    <path d="M 18,4 L 18,22 M 10,10 L 26,10 M 10,34 L 18,22 L 26,34" 
          stroke="#2d59a8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    
    <!-- "CHILD JUSTICE FORUM" text below -->
    <text x="0" y="54" class="logo-text">CHILD JUSTICE FORUM</text>
  </g>
</svg>